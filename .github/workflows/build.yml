# 푸시할 때마다 Windows 설치파일(.exe)과 안드로이드 APK 를 빌드합니다.
# 결과물: GitHub 저장소 → Actions → 해당 실행 → 맨 아래 Artifacts 에서 다운로드
# v1.0.0 처럼 태그를 푸시하면 Releases 에도 올라갑니다.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - run: npm ci
      - run: npx tauri build
      # 앱 이름(울주AI점프)은 한글이지만, GitHub 첨부파일 이름은 한글이 지워지므로 영문 파일 이름으로 복사
      - name: Rename installer
        shell: pwsh
        run: |
          $f = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Copy-Item $f.FullName "UljuAIJump_${v}_x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: UljuAIJump_*_x64-setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk ujump.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ujump.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/windows-installer/*.exe
            out/android-apk/*.apk
